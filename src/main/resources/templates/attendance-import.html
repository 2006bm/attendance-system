<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导入班级学生花名册</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<div th:replace="fragments/navbar :: navbar('import')"></div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4">
            <h2 class="text-center mb-4">📥 导入班级学生花名册</h2>

            <!-- 成功及失败提示 -->
            <div th:if="${success}" class="alert alert-success">
                <span th:text="${success}"></span>
                <div th:if="${errors != null && !errors.isEmpty()}" class="mt-3">
                    <h6 class="text-danger fw-bold">❌ 以下行解析失败：</h6>
                    <ul class="list-group list-group-flush text-start" style="max-height: 200px; overflow-y: auto;">
                        <li class="list-group-item list-group-item-danger py-1" th:each="err : ${errors}" th:text="${err}"></li>
                    </ul>
                </div>
            </div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <!-- 表单提交 -->
            <form th:action="@{/attendance/import}" method="post" enctype="multipart/form-data">

                <!-- 1. 👈 新增：选择要把这批学生加入到哪门课程中 -->
                <div class="mb-3">
                    <label class="form-label fw-bold">1. 选择导入的课程：</label>
                    <select name="courseId" class="form-select" required>
                        <option value="">-- 请选择目标课程 --</option>
                        <!-- 这里的 courses 会由后台查出系统里所有的课程 -->
                        <option th:each="c : ${courses}" th:value="${c.courseId}" th:text="${c.courseName} + ' (' + ${c.className} + ')'"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">2. 选择学生花名册 Excel 文件：</label>
                    <input type="file" name="file" class="form-control" accept=".xlsx, .xls" required />
                    <div class="form-text">仅支持 .xlsx 和 .xls 格式。</div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">🚀 开始导入名单</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
