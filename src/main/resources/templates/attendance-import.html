<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>批量导入考勤记录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<!-- 引入导航栏 -->
<div th:replace="fragments/navbar :: navbar('list')"></div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4">
            <h2 class="text-center mb-4">📥 批量导入考勤记录</h2>

            <!-- 1. 成功及失败详细报告展示区 -->
            <div th:if="${success}" class="alert alert-success">
                <span th:text="${success}"></span>

                <!-- 展示详细失败原因 -->
                <div th:if="${errors != null && !errors.isEmpty()}" class="mt-3">
                    <h6 class="text-danger fw-bold">❌ 以下行解析失败，请检查 Excel 文件：</h6>
                    <ul class="list-group list-group-flush text-start" style="max-height: 200px; overflow-y: auto;">
                        <li class="list-group-item list-group-item-danger py-1"
                            th:each="err : ${errors}" th:text="${err}"></li>
                    </ul>
                </div>
            </div>

            <!-- 整体系统报错提示 -->
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <!-- 2. 原生上传表单 (不使用复杂的 JS，100% 稳定提交) -->
            <form th:action="@{/attendance/import}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-bold">选择 Excel 考勤文件：</label>
                    <input type="file" name="file" class="form-control" accept=".xlsx, .xls" required />
                    <div class="form-text">仅支持 .xlsx 和 .xls 格式，单个文件不能超过 10MB。</div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">🚀 开始导入</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
