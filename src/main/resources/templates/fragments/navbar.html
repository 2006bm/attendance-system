<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        th:fragment="navbar(activeTab)">
<div class="container">
    <a class="navbar-brand fw-bold" href="/dashboard">🏫 考勤系统</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
            <!-- 1. ⏱️ 考勤打卡：只有 STUDENT（学生）能看到 -->
            <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                <a class="nav-link"
                   th:classappend="${activeTab == 'checkIn'} ? 'active' : ''"
                   href="/attendance/checkIn">⏱️ 考勤打卡</a>
            </li>

            <!-- 2. 📋 考勤记录：只有 TEACHER（教师）或 ADMIN（管理员）能看到 -->
            <li class="nav-item" sec:authorize="hasAnyRole('TEACHER', 'ADMIN')">
                <a class="nav-link"
                   th:classappend="${activeTab == 'attendanceList'} ? 'active' : ''"
                   href="/attendance/list">📋 考勤记录</a>
            </li>

            <!-- 3. 📥 导入考勤：只有 TEACHER 或 ADMIN 能看到 -->
            <li class="nav-item" sec:authorize="hasAnyRole('TEACHER', 'ADMIN')">
                <a class="nav-link"
                   th:classappend="${activeTab == 'import'} ? 'active' : ''"
                   href="/attendance/import">📥 导入考勤</a>
            </li>

            <!-- 4. 👥 学生列表：只有 TEACHER 或 ADMIN 能看到 -->
            <li class="nav-item" sec:authorize="hasAnyRole('TEACHER', 'ADMIN')">
                <a class="nav-link"
                   th:classappend="${activeTab == 'studentList'} ? 'active' : ''"
                   href="/student/list">👥 学生列表</a>
            </li>
        </ul>
        <span class="navbar-text">
                <a class="btn btn-sm btn-outline-danger" href="/logout">安全退出</a>
            </span>
    </div>
</div>
</nav>
