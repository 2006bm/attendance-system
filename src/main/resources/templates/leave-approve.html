<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>假条审批控制台</title>
    <!-- 引入 Bootstrap 5 美化 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<!-- 1. 动态引入导航栏，传入参数 'leaveApprove' 维持高亮 -->
<div th:replace="fragments/navbar :: navbar('leaveApprove')"></div>

<div class="row justify-content-center g-4">

    <!-- ==================== 上半部分：待处理请假申请 ==================== -->
    <div class="col-md-11">
        <div class="card shadow p-4 mb-4 border-0">
            <h3 class="text-center text-warning mb-4">⏳ 待处理请假申请</h3>
            <div class="table-responsive">
            <table class="table table-hover align-middle text-center">
                <thead class="table-warning">
                <tr>
                    <th>学号</th>
                    <th>学生姓名</th>
                    <th>申请课程</th>
                    <th>请假原因</th>
                    <th>申请时间</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <!-- 如果当前没有待审批的请假单 -->
                <tr th:if="${#lists.isEmpty(pendingLeaves)}">
                    <td colspan="6" class="text-center text-muted py-4 fw-bold">🎉 暂时没有需要您处理的请假申请！</td>
                </tr>

                <!-- 循环渲染所有待审批的单子 -->
                <tr th:each="leave : ${pendingLeaves}">
                    <td th:text="${leave.studentId}" class="fw-bold">20210001</td>
                    <td th:text="${leave.studentName}">张三</td>
                    <td th:text="${leave.courseId}" class="text-primary fw-bold">CS101</td>
                    <td th:text="${leave.reason}" class="text-start">肚子疼</td>
                    <td th:text="${#temporals.format(leave.createTime, 'yyyy-MM-dd HH:mm')}">2023-10-23 08:30</td>
                    <td>
                        <div class="d-flex justify-content-center gap-2">
                            <!-- 同意按钮：点击后将 APPROVED 传给后端 -->
                            <a th:href="@{/leave/action/{id}/APPROVED(id=${leave.id})}"
                               class="btn btn-sm btn-success fw-bold px-3">同意</a>

                            <!-- 拒绝按钮：点击后将 REJECTED 传给后端 -->
                            <a th:href="@{/leave/action/{id}/REJECTED(id=${leave.id})}"
                               class="btn btn-sm btn-danger fw-bold px-3">拒绝</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
            </div>
        </div>
    </div>

    <!-- ==================== 下半部分：已审批历史记录 ==================== -->
    <div class="col-md-11">
        <div class="card shadow p-4 border-0">
            <h3 class="text-center text-secondary mb-4">📜 已处理假条历史记录</h3>
            <table class="table table-hover align-middle text-center">
                <thead class="table-secondary">
                <tr>
                    <th>学号</th>
                    <th>学生姓名</th>
                    <th>申请课程</th>
                    <th>请假原因</th>
                    <th>审批结果</th>
                </tr>
                </thead>
                <tbody>
                <!-- 如果没有审批过任何假条 -->
                <tr th:if="${#lists.isEmpty(processedLeaves)}">
                    <td colspan="5" class="text-center text-muted py-4">暂无历史审批记录。</td>
                </tr>

                <!-- 循环渲染已处理完的假条列表 -->
                <tr th:each="leave : ${processedLeaves}">
                    <td th:text="${leave.studentId}" class="fw-bold">20210001</td>
                    <td th:text="${leave.studentName}">张三</td>
                    <td th:text="${leave.courseId}" class="text-primary fw-bold">CS101</td>
                    <td th:text="${leave.reason}" class="text-start">事假</td>
                    <td>
                        <!-- 动态彩色标签 -->
                        <span class="badge rounded-pill px-3 py-2"
                              th:classappend="${leave.status == 'APPROVED'} ? 'bg-success' : 'bg-danger'"
                              th:text="${leave.status == 'APPROVED' ? '✅ 已通过' : '❌ 已拒绝'}">
                            已通过
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- 引入 Bootstrap JS 激活弹窗组件 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
