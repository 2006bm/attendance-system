<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户登录</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<div class="row justify-content-center">
  <div class="col-md-4">
    <h2 class="text-center mb-4">用户登录</h2>
    <!-- 错误回显 -->
    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

    <!-- 找到 login.html 里的 <form action="/login" method="post" ...> -->
    <form action="/login" method="post" class="card p-4 shadow">

      <!-- 👈 1. 新增隐藏域：如果网址里带了参数，Thymeleaf 会自动填入这里 -->
      <input type="hidden" name="targetCourseId" th:value="${param.targetCourseId}" />
      <input type="hidden" name="targetCode" th:value="${param.targetCode}" />

      <!-- 原有的用户名、密码等输入框保持不变 -->
      <div class="mb-3">
        <label class="form-label">用户名：</label>
        <input type="text" name="username" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label">密码：</label>
        <input type="password" name="password" class="form-control" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">登录</button>

      <div class="d-flex justify-content-between mt-3">
        <!-- 👈 2. 修改“去注册”链接：去注册时，也用 URL 把参数带过去 -->
        <a th:href="@{/register(targetCourseId=${param.targetCourseId}, targetCode=${param.targetCode})}" class="btn btn-link p-0">还没有账号？去注册</a>
        <a href="/dashboard" class="btn btn-link p-0 text-secondary">返回首页</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
