<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>修改密码</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<!-- 引入导航栏 -->
<div th:replace="fragments/navbar :: navbar('dashboard')"></div>

<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow p-4 border-0">
      <h3 class="text-center text-primary mb-4">🔑 修改我的密码</h3>

      <!-- 成功提示 -->
      <div th:if="${param.success}" class="alert alert-success">
        🎉 密码修改成功！下次登录生效。
      </div>
      <!-- 失败提示 -->
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <form th:action="@{/user/password}" method="post">
        <div class="mb-3">
          <label class="form-label fw-bold">输入当前旧密码：</label>
          <input type="password" name="oldPassword" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">输入新密码：</label>
          <input type="password" name="newPassword" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">再次确认新密码：</label>
          <input type="password" name="confirmPassword" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">确认修改密码</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
