<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户注册</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<div class="row justify-content-center">
  <div class="col-md-4">
    <h2 class="text-center mb-4">用户注册</h2>
    <div th:if="${param.error}" class="alert alert-danger">
      注册失败，用户名可能已存在！
    </div>
    <form action="/user/register" method="post" class="card p-4 shadow">
      <input type="hidden" name="targetCourseId" th:value="${param.targetCourseId}" />
      <input type="hidden" name="targetCode" th:value="${param.targetCode}" />
      <!-- 👈 精准美化与限制：用户名输入框 -->
      <div class="mb-3">
        <label class="form-label fw-bold">用户名：</label>

        <!--
           1. placeholder: 框内淡灰色背景提示
           2. pattern="\d{8}": 核心约束！HTML5 原生限制必须是 8 位纯数字，多一位或少一位、或者输入汉字字母，提交时浏览器都会直接弹窗报错拒绝！
           3. maxlength="8": 限制最多只能敲入 8 个字符，防止多输
           4. title: 当输入格式不对时，浏览器弹窗提示的文字
        -->
        <input type="text"
               name="username"
               class="form-control"
               placeholder="请输入您的 8 位学号 (如 20240001)"
               pattern="\d{8}"
               maxlength="8"
               title="用户名必须为 8 位数字学号！"
               required />

        <!-- 5. 框下方的灰色小字弱提示 -->
        <div class="form-text text-muted">提示：请最好输入真实的 8 位数字学号，用于系统登录和打卡匹配。</div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">真实姓名：</label>
        <input type="text" name="realName" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">密码：</label>
        <input type="password" name="password" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">确认密码：</label>
        <input type="password" name="confirmPassword" class="form-control" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">注册</button>

      <div class="d-flex justify-content-between mt-3">
        <a href="/login" class="btn btn-link p-0">已有账号？去登录</a>
        <a href="/dashboard" class="btn btn-link p-0 text-secondary">返回首页</a>
      </div>
    </form>
    <script>
      document.querySelector("form").onsubmit = function() {
        var password = document.getElementsByName("password")[0].value;
        var confirm = document.getElementsByName("confirmPassword")[0].value;
        if (password !== confirm) {
          alert("两次密码输入不一致！");
          return false; // 阻止表单提交
        }
        return true;
      };
    </script>
  </div>
</div>
</body>
</html>
