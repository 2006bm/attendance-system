<p th:text="${student.studentName}"></p>
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学生信息表单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4" th:text="${student.id == null ? '新增学生' : '编辑学生'}">学生表单</h2>

        <!-- 表单：th:object 将页面和后端传来的 student 对象绑定 -->
        <form th:action="@{/student/save}" th:object="${student}" method="post">
            <!-- 隐藏 ID 字段，否则更新时找不到是哪一条数据 -->
            <input type="hidden" th:field="*{id}" />
            <!-- 年龄 -->
            <div class="mb-3">
                <label>年龄：</label>
                <input type="number" th:field="*{age}" class="form-control" />
            </div>

            <!-- 班级 -->
            <div class="mb-3">
                <label>班级：</label>
                <input type="text" th:field="*{className}" class="form-control" />
            </div>
            <div class="mb-3">
                <label>学号：</label>
                <input type="text" th:field="*{studentId}" class="form-control" required />
            </div>

            <div class="mb-3">
                <label>姓名：</label>
                <input type="text" th:field="*{studentName}" class="form-control" required />
            </div>

            <div class="mb-3">
                <label>性别：</label>
                <select th:field="*{gender}" class="form-select">
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
                <span th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}" style="color:red;"></span>

            </div>

            <div class="mb-3">
                <label>出生日期：</label>
                <input type="date" th:field="*{birthday}" class="form-control" />
                <span th:if="${#fields.hasErrors('birthday')}" th:errors="*{birthday}" style="color:red;"></span>
            </div>

            <div class="mb-3">
                <label>联系方式：</label>
                <input type="text" th:field="*{phone}" class="form-control" />
                <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" style="color:red;"></span>
            </div>

            <button type="submit" class="btn btn-success">保存信息</button>
            <a href="/student/list" class="btn btn-secondary">取消</a>
        </form>
    </div>
</div>
</body>
</html>
