<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<div th:replace="fragments/navbar :: navbar('studentList')"></div>
<h2>学生列表</h2>
<a href="/student/add" class="btn btn-primary">新增学生</a>
<table class="table table-bordered table-hover">
  <thead class="table-light">
  <tr>
    <th>id</th>
    <th>学号</th>
    <th>姓名</th>
    <th>班级</th>
    <th>性别</th>
    <th>出生日期</th>
    <th>联系方式</th>
    <th>操作</th>
  </tr>
  </thead>
  <tbody>
  <!-- 核心渲染：如果 students 是空的，这里就不会显示行 -->
  <tr th:each="s : ${students}">
    <td th:text="${s.id}"></td>
    <td th:text="${s.studentId}"></td>
    <td th:text="${s.studentName}"></td>
    <td th:text="${s.className}"></td>
    <td th:text="${s.gender}"></td>
    <td th:text="${s.birthday}"></td>
    <td th:text="${s.phone}"></td>
    <td>
      <a th:href="@{/student/edit/{id}(id=${s.id})}">编辑</a>
    </td>
  </tr>
  </tbody>
</table>

<!-- 分页导航 -->
<nav>
  <ul class="pagination">
    <li class="page-item" th:classappend="${currentPage==1} ? 'disabled'">
      <a class="page-link" th:href="@{/student/list(page=${currentPage - 1})}">上一页</a>
    </li>
    <li class="page-item active"><a class="page-link" th:text="${currentPage}">1</a></li>
    <li class="page-item" th:classappend="${currentPage==totalPages} ? 'disabled'">
      <a class="page-link" th:href="@{/student/list(page=${currentPage + 1})}">下一页</a>
    </li>
  </ul>
</nav>

</body>
</html>
